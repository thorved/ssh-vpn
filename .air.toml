root = "."
tmp_dir = "backend/tmp"
env_files = [".env", "backend/.env"]

[build]
cmd = "cd backend; go build -o ./tmp/ssh-vpn.exe ./cmd/server"
full_bin = "cd backend; ./tmp/ssh-vpn.exe"
delay = 1000
exclude_dir = ["data", "tmp", "backend/data", "backend/tmp", "frontend", "node_modules", ".next", "out"]
include_dir = ["backend/cmd", "backend/internal"]
include_file = [".env", "backend/.env"]
include_ext = ["go", "env"]
kill_delay = 500
log = "air-build.log"
send_interrupt = true
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
